name: ci

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  workflow_dispatch:

jobs:
  build_ohos:
    name: Build OHOS
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version info
        run: |
          sha_short="$(git rev-parse --short HEAD)"
          branch="${GITHUB_REF_NAME}"
          echo "sha_short=${sha_short}" >> $GITHUB_ENV
          echo "branch=${branch}" >> $GITHUB_ENV
        shell: bash

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils zip libglu1-mesa
        shell: bash

      - name: Setup HarmonyOS toolchain
        uses: ErBWs/setup-ohos@v1
        with:
          version: latest
          cache: true

      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup flutter-ohos
        run: |
          git clone -b oh-3.41.9-release https://gitcode.com/CPF-Flutter/flutter_flutter.git $GITHUB_WORKSPACE/flutter
          echo "$GITHUB_WORKSPACE/flutter/bin" >> $GITHUB_PATH
        shell: bash

      - name: Generate env.json
        run: dart .vscode/build_env.dart
        shell: bash

      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: 1

      - name: Rename package
        run: |
          sed -i "s/name: PiliPlus/name: piliplus/g" pubspec.yaml
          find lib -type f -name "*.dart" -exec sed -i "s/import 'package:PiliPlus/import 'package:piliplus/g" {} \;
        shell: bash

      - name: Add ohos platform
        run: flutter create --platforms ohos .
        shell: bash

      - name: Build Flutter for ohos
        run: flutter build hap --release --dart-define-from-file=.vscode/env.json
        shell: bash
        continue-on-error: true

      - name: Package ohos build output
        run: |
          cp ./ohos/entry/build/default/outputs/default/entry-default-unsigned.hap \
             PiliPlus_ohos_${{ env.branch }}_${{ env.sha_short }}_unsigned.hap
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PiliPlus_ohos_${{ env.branch }}
          path: PiliPlus_ohos_*.hap
